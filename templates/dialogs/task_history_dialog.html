<!-- Modal -->
<div class="modal fade" id="HistoryModal" tabindex="-1" aria-labelledby="HistoryLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="HistoryLabel">История изменений</h5>                
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                
            </div>
       
            <div class="modal-body">                
               <table class="table">
                    {% for h in history %}
                        <tr>
                            <td>{{h.history_date}}</td>
                            <td>{{h.user_fk.get_full_name}}</td>
                            <td>{{h.history_text}}</td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td>Изменения не найдены</td>
                        </tr>
                    {% endfor %}
               </table>      
            </div>
            
            <div class="modal-footer">
                <small>Отображаются последние 10 изменений</small>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Отмена</button>                
            </div>
       
        </div>
    </div>   
</div>
