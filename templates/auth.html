<html>
{%load static%}
<head>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <script src="{% static 'js/jquery.js' %}"></script>
    <script src="{% static 'js/jquery-ui.js' %}"></script>
    <script src="{% static 'js/tabs.js' %}"></script>
    
</head>
<body class="bg_gray">

<div class="d-flex p-2 h-100 justify-content-center align-items-center">
    <div class="container ">
        {% if error %}
        <div class="row">
            <div class="col-md-12">
                <div class="error sticky-top alert alert-danger" role="alert">
                    {{error}}
                </div>
            </div>            
        </div>
        {% endif %}
        <div class="row fixed_h-400 shadow-sm">
            <div class="col-md-6 text-center text-white bg-dark pd_50">
                <img class="img-fluid" src="{% static 'images/logo.svg' %}" alt="" width='128'>
                <h2 class='mt_40'>Nova</h2>
                <h4>HelpDesk</h4>
            </div>
            <div class="col-md-6 text-center bg_white pd_50">
            
                <div id="tabs">
                    <ul>
                        <li class="pd_20 mrgn_10"><a href="#tab-1">Авторизация</a></li>                        
                        <li class="pd_20 mrgn_10"><a href="#tab-2">Статус заявки</a></li>
                    </ul>

                    <div id="tab-1">
                        <form action="/syslogin/login" method="POST" class='text-left'>
                            {% csrf_token %}                    
                            <div class="form-group">
                                <label for="LoginGroup">Имя пользователя</label>
                                <input type="text" class="form-control" id="LoginGroup" placeholder="Имя пользователя" name='username'>
                            </div>
                            <div class="form-group">
                                <label for="PasswordGroup">Пароль</label>
                                <input type="password" class="form-control" id="PasswordGroup" placeholder="Пароль" name='password'>
                            </div>
                            <button class="btn btn-success" type="submit">Войти</button>
                        </form>
                    </div>                   

                    <div id="tab-2">
                        <form action="/check" method="POST" class='text-left'>
                            {% csrf_token %}                    
                            <div class="form-group">
                                <label for="UIDGroup">UID Задачи</label>
                                <input type="text" class="form-control" id="UIDGroup" placeholder="UID Задачи" name='uuid'>
                            </div>
                            <div class="form-group">
                                <label for="EmailGroup">E-mail</label>
                                <input type="email" class="form-control" id="EmailGroup" placeholder="E-mail" name='email'>
                            </div>
                            <button class="btn btn-success" type="submit">Проверить</button>
                        </form>
                    </div>

                </div>

            </div>
        </div>
        
            <div class="row">
                <div class="col-md-12">
                    <div class="footer text-right shadow-text-inset">
                        Powered by Nova &copy; {% now  'Y' %}
                    </div>
                </div>
            </div>

    </div>
    
</div>
</body>
</html>
